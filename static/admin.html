<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Box Office — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110F;
    --panel: #1C1712;
    --panel-raised: #241E18;
    --line: #33291F;
    --gold: #E8A93A;
    --gold-dim: #7A5D24;
    --red: #B23A3A;
    --green: #5E8F5B;
    --text: #F2EDE4;
    --muted: #8F8377;
    --mono: "Roboto Mono", monospace;
    --display: "Bebas Neue", "Inter", sans-serif;
    --body: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ---- Login screen ---- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 32px 30px;
    width: 100%;
    max-width: 320px;
  }
  .login-card h1 {
    font-family: var(--display);
    font-size: 26px;
    letter-spacing: 1px;
    color: var(--gold);
    margin: 0 0 4px;
  }
  .login-card .sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 11px;
  }
  .field input:focus { outline: none; border-color: var(--gold-dim); }
  .login-btn {
    width: 100%;
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #1A1409;
    font-weight: 600;
    font-size: 13.5px;
    padding: 11px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 6px;
  }
  .login-btn:hover { background: #F2B84D; }
  .login-error {
    color: #E08585;
    font-size: 12px;
    margin-top: 10px;
    display: none;
  }
  .login-error.show { display: block; }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dashed transparent;
  }
  .back-link:hover { border-color: var(--line); }

  /* ---- Dashboard ---- */
  .dash { display: none; }
  .dash.show { display: block; }

  .topbar {
    padding: 20px 28px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar h1 {
    font-family: var(--display);
    font-size: 26px;
    letter-spacing: 1px;
    color: var(--gold);
    margin: 0;
  }
  .topbar .actions { display: flex; gap: 10px; align-items: center; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--gold-dim); color: var(--text); }

  .content { padding: 24px 28px 48px; max-width: 1180px; margin: 0 auto; }

  .summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .summary-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
  }
  .summary-card .label { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .summary-card .value {
    font-family: var(--display);
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 0.5px;
  }

  .section-title {
    font-size: 12.5px;
    color: var(--muted);
    margin: 30px 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12.5px;
  }
  thead th {
    text-align: left;
    padding: 10px 14px;
    background: var(--panel-raised);
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(232,169,58,0.04); }
  .num { font-family: var(--mono); }
  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid var(--line);
    color: var(--muted);
    margin-right: 4px;
  }
  .tag.on { border-color: var(--green); color: #9FCB9B; }

  .search-input {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--body);
    font-size: 12.5px;
    padding: 7px 10px;
    width: 220px;
  }
  .search-input:focus { outline: none; border-color: var(--gold-dim); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <h1>BOX OFFICE</h1>
    <div class="sub">Admin portal — authorized staff only</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-user" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password" />
    </div>
    <button class="login-btn" id="login-btn">Log in</button>
    <div class="login-error" id="login-error"></div>
    <a class="back-link" href="/">← Back to booking counter</a>
  </div>
</div>

<!-- Dashboard -->
<div class="dash" id="dash">
  <div class="topbar">
    <h1>BOX OFFICE — LEDGER</h1>
    <div class="actions">
      <button class="btn-ghost" id="export-btn">Export CSV</button>
      <button class="btn-ghost" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="content">
    <div class="summary-cards" id="summary-cards"></div>

    <div class="section-title">By show</div>
    <table id="per-show-table">
      <thead>
        <tr><th>Show</th><th>Bookings</th><th>Seats sold</th><th>Revenue</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="section-title">
      <span>All bookings</span>
      <input class="search-input" id="search-input" placeholder="Search name or phone…" />
    </div>
    <table id="bookings-table">
      <thead>
        <tr>
          <th>Booked at</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Show</th>
          <th>Seats</th>
          <th>Offers</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none; margin-top: 12px;">No bookings yet.</div>
  </div>
</div>

<script>
const API = "";
let token = localStorage.getItem("admin_token") || null;
let allBookings = [];

const loginScreen = document.getElementById("login-screen");
const dash = document.getElementById("dash");
const loginBtn = document.getElementById("login-btn");
const loginError = document.getElementById("login-error");
const logoutBtn = document.getElementById("logout-btn");
const exportBtn = document.getElementById("export-btn");
const searchInput = document.getElementById("search-input");

function showDash() {
  loginScreen.style.display = "none";
  dash.classList.add("show");
  loadData();
}
function showLogin(msg) {
  dash.classList.remove("show");
  loginScreen.style.display = "flex";
  if (msg) {
    loginError.textContent = msg;
    loginError.classList.add("show");
  }
}

async function login() {
  const username = document.getElementById("login-user").value.trim();
  const password = document.getElementById("login-pass").value;
  loginError.classList.remove("show");
  try {
    const res = await fetch(`${API}/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      loginError.textContent = data.detail || "Login failed.";
      loginError.classList.add("show");
      return;
    }
    token = data.token;
    localStorage.setItem("admin_token", token);
    showDash();
  } catch (e) {
    loginError.textContent = "Could not reach the API.";
    loginError.classList.add("show");
  }
}

async function logout() {
  try {
    await fetch(`${API}/admin/logout`, {
      method: "POST",
      headers: { "X-Admin-Token": token || "" },
    });
  } catch (e) {}
  localStorage.removeItem("admin_token");
  token = null;
  showLogin();
}

async function authedFetch(path) {
  const res = await fetch(`${API}${path}`, {
    headers: { "X-Admin-Token": token || "" },
  });
  if (res.status === 401) {
    localStorage.removeItem("admin_token");
    token = null;
    showLogin("Session expired — please log in again.");
    return null;
  }
  return res.json();
}

async function loadData() {
  const [summary, bookings] = await Promise.all([
    authedFetch("/admin/summary"),
    authedFetch("/admin/bookings"),
  ]);
  if (!summary || !bookings) return;
  renderSummary(summary);
  allBookings = bookings;
  renderBookings(allBookings);
}

function renderSummary(s) {
  const cards = document.getElementById("summary-cards");
  cards.innerHTML = `
    <div class="summary-card"><div class="label">Total bookings</div><div class="value">${s.total_bookings}</div></div>
    <div class="summary-card"><div class="label">Seats sold</div><div class="value">${s.total_seats_sold}</div></div>
    <div class="summary-card"><div class="label">Total revenue</div><div class="value">₹${s.total_revenue}</div></div>`;

  const tbody = document.querySelector("#per-show-table tbody");
  tbody.innerHTML = s.per_show.length
    ? s.per_show.map(row => `
        <tr>
          <td>${row.show_title}</td>
          <td class="num">${row.bookings}</td>
          <td class="num">${row.seats}</td>
          <td class="num">₹${row.revenue}</td>
        </tr>`).join("")
    : `<tr><td colspan="4" style="color: var(--muted);">No bookings yet.</td></tr>`;
}

function renderBookings(rows) {
  const tbody = document.querySelector("#bookings-table tbody");
  const emptyState = document.getElementById("empty-state");
  if (!rows.length) {
    tbody.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";
  tbody.innerHTML = rows.map(b => {
    const seats = Object.entries(b.tickets).map(([tier, qty]) => `${tier}×${qty}`).join(", ");
    const when = new Date(b.created_at).toLocaleString();
    return `
      <tr>
        <td class="num">${when}</td>
        <td>${escapeHtml(b.customer_name)}</td>
        <td class="num">${escapeHtml(b.phone)}</td>
        <td>${escapeHtml(b.show_title)}</td>
        <td>${seats}</td>
        <td>
          ${b.is_member ? '<span class="tag on">Member</span>' : ''}
          ${b.festival_applied ? '<span class="tag on">Festival</span>' : ''}
        </td>
        <td class="num">₹${b.grand_total}</td>
      </tr>`;
  }).join("");
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function exportCsv() {
  if (!allBookings.length) return;
  const headers = ["Booked At", "Customer", "Phone", "Show", "Seats", "Member", "Festival", "Grand Total"];
  const rows = allBookings.map(b => [
    b.created_at,
    b.customer_name,
    b.phone,
    b.show_title,
    Object.entries(b.tickets).map(([t, q]) => `${t}x${q}`).join(" "),
    b.is_member ? "Yes" : "No",
    b.festival_applied ? "Yes" : "No",
    b.grand_total,
  ]);
  const csv = [headers, ...rows]
    .map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(","))
    .join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bookings.csv";
  a.click();
  URL.revokeObjectURL(url);
}

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = !q ? allBookings : allBookings.filter(b =>
    b.customer_name.toLowerCase().includes(q) || b.phone.toLowerCase().includes(q)
  );
  renderBookings(filtered);
});

loginBtn.addEventListener("click", login);
document.getElementById("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
logoutBtn.addEventListener("click", logout);
exportBtn.addEventListener("click", exportCsv);

if (token) { showDash(); } else { showLogin(); }
</script>
</body>
</html>
